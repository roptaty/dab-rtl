# cargo-deny configuration
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only check dependencies for the default features
# targets = []

# ── Vulnerability advisories ────────────────────────────────────────────────── #
[advisories]
# RustSec advisory database: https://rustsec.org/advisories/
version = 2
# Deny all vulnerabilities (no exceptions by default)
ignore = [
    # paste is unmaintained but it's a transitive dep of ratatui — no action
    # we can take until ratatui migrates to pastey. Not a security issue.
    "RUSTSEC-2024-0436",
]

# ── License policy ──────────────────────────────────────────────────────────── #
[licenses]
version = 2
# Accepted open-source licenses for this project.
# All dependencies MUST use one of these licenses (or a AND/OR combination).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# Any license not in the allow list is denied by default.
# Copyleft and unlicensed crates are rejected because they are not listed above.
#
# Exceptions for crates whose license is not in the general allow list.
[[licenses.exceptions]]
name = "rtlsdr_mt"
allow = ["GPL-2.0-or-later"]
[[licenses.exceptions]]
name = "rtlsdr_sys"
allow = ["GPL-2.0-or-later"]

# ── Dependency bans ─────────────────────────────────────────────────────────── #
[bans]
# Warn when multiple versions of the same crate are pulled in
multiple-versions = "warn"
# Allow wildcard versions for workspace-internal path dependencies.
# External crates still require explicit versions via Cargo.lock.
wildcards = "allow"
# List of crates that must not be used in this project
deny = [
    # Example: ban known-broken or insecure crates
    # { name = "openssl", reason = "use rustls instead" },
]
# Skip duplicate-version warnings for crates known to have divergent version requirements
skip = [
    # Example: { name = "bitflags", version = "=1" }
]

# ── Source origins ───────────────────────────────────────────────────────────── #
[sources]
# Only allow dependencies from crates.io and this repository's local paths
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
