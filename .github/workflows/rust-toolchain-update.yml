name: Rust toolchain update

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    # Check weekly on Thursday at 10:00 UTC (Rust releases on Thursdays)
    - cron: "0 10 * * 4"
  workflow_dispatch:

jobs:
  check-update:
    name: Check for new stable Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get current pinned version
        id: current
        run: |
          version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get latest stable version
        id: latest
        run: |
          # Fetch the latest stable release version from the Rust release manifest
          version=$(curl -sSf https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | grep -m1 '^version = ' | sed 's/.*"\(.*\)"/\1/' | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update toolchain if newer version available
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          sed -i 's/channel = ".*"/channel = "${{ steps.latest.outputs.version }}"/' rust-toolchain.toml
          cat rust-toolchain.toml

      - name: Create pull request
        if: steps.current.outputs.version != steps.latest.outputs.version
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/rust-toolchain-${{ steps.latest.outputs.version }}
          commit-message: "chore: bump Rust toolchain to ${{ steps.latest.outputs.version }}"
          title: "chore: bump Rust toolchain to ${{ steps.latest.outputs.version }}"
          body: |
            Updates `rust-toolchain.toml` from **${{ steps.current.outputs.version }}** to **${{ steps.latest.outputs.version }}**.

            This PR was created automatically. Review the [Rust release notes](https://blog.rust-lang.org/) and ensure CI passes before merging.

            After merging, update your local toolchain with `rustup update`.
          labels: dependencies
