[package]
name        = "dab-rtl"
description = "DAB/DAB+ software-defined radio receiver for RTL-SDR hardware"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
default = []
mp2 = ["audio/mp2"]
# Render slideshow / cover-art images inline by suspending the TUI and
# printing the image with viuer (ANSI half-blocks; sixel / kitty / iterm2
# autodetected when supported). Without the feature the TUI shows
# filename + dimensions only.
slideshow-image = ["dep:viuer", "dep:image"]

[[bin]]
name = "dab-rtl"
path = "src/main.rs"

[dependencies]
sdr      = { path = "../sdr" }
ofdm     = { path = "../ofdm" }
fec      = { path = "../fec" }
protocol = { path = "../protocol" }
audio    = { path = "../audio" }
num-complex = "0.4"
clap        = { version = "4", features = ["derive"] }
ratatui     = "0.26"
crossterm   = "0.27"
log         = "0.4"
env_logger  = "0.11"
nix         = { version = "0.29", features = ["fs", "term"] }
viuer       = { version = "0.7", optional = true }
image       = { version = "0.24", optional = true, default-features = false, features = ["png", "jpeg"] }
